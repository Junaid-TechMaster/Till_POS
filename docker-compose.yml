services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tillpro
      POSTGRES_PASSWORD: tillpro
      POSTGRES_DB: tillpro
    ports:
      - "5432:5432"
    volumes:
      - tillpro-pg:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://tillpro:tillpro@postgres:5432/tillpro
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:5174}
      PORT: "8787"
      NODE_ENV: production
      LICENCE_PRIVATE_KEY_PATH: /keys/licence-private.pem
    ports:
      - "8787:8787"
    volumes:
      - ./apps/api/keys:/keys:ro

volumes:
  tillpro-pg:
